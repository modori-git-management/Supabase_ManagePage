<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>MODORI 관리자 콘솔</title>
<style>
/* ── 색상은 이 블록만 바꾸면 전체가 바뀝니다 ─────────────────────────
   잉크(왼쪽 메뉴) + 종이(본문) + 형광펜(강조). 공부하는 서비스라서 노트와 형광펜을 모티프로 했어요. */
:root{
 --ink:#1b2140; --ink2:#2a3160; --ink-t:#b9c0e0;           /* 왼쪽 메뉴 */
 --paper:#f4f5fa; --surface:#ffffff; --sunk:#eceef6; --line:#e1e4ef;   /* 배경, 카드, 표 머리글, 구분선 */
 --tx:#1a1f36; --mu:#626a80;                                /* 글자, 보조 글자 */
 --mark:#ffd84a; --mark-soft:rgba(255,216,74,.55);          /* 형광펜 */
 --pri:#1b2140; --on-pri:#ffffff; --focus:#3b55e6;          /* 주요 버튼, 키보드 포커스 */
 --ok:#16875d; --bad:#cf3a3a; --warn:#a56a00;               /* 정상, 문제, 주의 */
 --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;    /* 그래프의 서비스 색: STU, Gudoks, BOOK, 다음 서비스. 순서 고정(색 검증 완료) */
}
@media(prefers-color-scheme:dark){:root{
 --ink:#0a0d1d; --ink2:#1a2043; --ink-t:#9aa1c4;
 --paper:#0f1226; --surface:#171b36; --sunk:#12162d; --line:#2a2f52;
 --tx:#e6e8f5; --mu:#9ba2c6;
 --mark-soft:rgba(255,216,74,.38);
 --pri:#ffd84a; --on-pri:#1b2140; --focus:#ffd84a;
 --ok:#43c795; --bad:#ff8080; --warn:#f0b429;
 --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;background:var(--paper);color:var(--tx);overflow:hidden;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
p{margin:0;white-space:pre-wrap;word-break:break-word}
button,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;min-height:34px;cursor:pointer}
button:hover{background:var(--sunk)}
button:disabled{opacity:.5;cursor:default}
button.primary{background:var(--pri);color:var(--on-pri);border-color:var(--pri);font-weight:600}
button.primary:hover{filter:brightness(1.12)}
button.ghost{background:none}
input,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px;margin:4px 0 10px}
input[type=checkbox]{width:auto;margin:0 6px 0 0;vertical-align:-2px}
textarea{min-height:84px;resize:vertical}
label{display:block;font-size:13px;color:var(--mu)}
.m{color:var(--mu);font-size:12px}.err{color:var(--bad)}

/* 로그인 */
#login{display:grid;place-items:center;height:100dvh;padding:16px}
.login-card{width:min(360px,100%);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 26px 22px}
.wordmark{font-size:26px;font-weight:800;letter-spacing:.02em;margin:0}
.wordmark span{background:linear-gradient(transparent 62%,var(--mark-soft) 62% 92%,transparent 92%);padding:0 .1em}
.login-card .sub{color:var(--mu);margin:2px 0 22px}
.login-card button{width:100%;margin-top:4px}

/* 전체 틀: 왼쪽 메뉴 + 본문. 화면 높이에 딱 맞추고 스크롤은 안쪽에서만 */
#app{display:grid;grid-template-columns:208px minmax(0,1fr);height:100dvh}
#side{background:var(--ink);color:var(--ink-t);display:flex;flex-direction:column;padding:18px 12px 14px;min-height:0}
.brand{font-weight:800;font-size:18px;letter-spacing:.02em;color:#fff;padding:2px 10px 16px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--ink-t);letter-spacing:0;margin-top:2px}
#nav{display:flex;flex-direction:column;gap:2px;overflow:auto;flex:1;min-height:0}
#nav button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;color:var(--ink-t);padding:8px 12px;border-radius:6px;min-height:38px}
#nav button:hover{background:var(--ink2);color:#fff}
#nav button.on{background:var(--ink2);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 #ffd84a}
.badge{background:#ffd84a;color:#1b2140;border-radius:999px;font-size:11px;font-weight:700;padding:0 7px;line-height:18px}
.side-foot{margin-top:8px;padding:12px 4px 0;border-top:1px solid var(--ink2);display:flex;flex-direction:column;gap:8px;font-size:12px}
.side-foot button{background:none;border:1px solid var(--ink2);color:var(--ink-t)}
.side-foot button:hover{background:var(--ink2);color:#fff}
#main{display:flex;flex-direction:column;min-width:0;min-height:0;height:100dvh}
#top{display:flex;align-items:center;gap:12px;padding:16px 22px 12px}
#top h1{font-size:20px;line-height:1.3;margin:0;font-weight:700;flex:1}
#v{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 22px 18px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;border-radius:0;background:none;min-height:32px}
.seg button.on{background:var(--pri);color:var(--on-pri);font-weight:600}

/* 표 */
.scroll{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.scroll.plain{background:none;border:0;border-radius:0}
table{border-collapse:separate;border-spacing:0;width:100%}
th{position:sticky;top:0;z-index:1;background:var(--sunk);text-align:left;font-weight:600;font-size:12px;color:var(--mu);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:280px;overflow:hidden;text-overflow:ellipsis}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--sunk)}
.empty{padding:36px 16px;text-align:center;color:var(--mu)}
.pill{display:inline-block;padding:0 8px;border-radius:999px;font-size:12px;line-height:20px;background:var(--sunk);color:var(--mu);white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}

/* 문의·공지 목록 */
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--mu);font-size:12px;margin-bottom:6px}
.ttl{font-weight:600;margin-bottom:2px}
.answer{margin-top:8px;padding:6px 0 6px 12px;border-left:3px solid #ffd84a}
.item textarea{margin-top:10px}
.cols{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:12px;flex:1;min-height:0}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;align-self:start}
.cols>.scroll,.cols>.list{min-height:0}
.list{overflow:auto}

/* 개요 */
.ledger{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
button.cell{display:block;text-align:left;border:0;border-right:1px solid var(--line);border-radius:0;background:none;padding:14px 16px;min-height:0;cursor:pointer}
button.cell:last-child{border-right:0}
button.cell:hover{background:var(--sunk)}
.cell .lb{display:block;font-size:12px;color:var(--mu)}
.cell .nm{display:inline-block;font-size:30px;line-height:1.25;font-weight:700;margin:2px 0;background:linear-gradient(transparent 62%,var(--mark-soft) 62% 92%,transparent 92%);padding:0 .12em;margin-left:-.12em}
.cell .sb{display:block;font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:12px;flex:1;min-height:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-height:0;min-width:0}
.panel header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600}
.panel header button{min-height:28px;padding:2px 10px;font-weight:400;font-size:13px}
.pb{overflow:auto;flex:1;min-height:0}
button.row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;padding:9px 14px;min-height:0}
button.row:last-child{border-bottom:0}
button.row:hover{background:var(--sunk)}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .rk{width:22px;font-weight:700;color:var(--mu)}
.statusline{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:center;padding:10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;padding:14px;margin:0}
.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:600}

/* 그래프 */
.charts{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px}
.charts>*{flex:none}
.pies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pie-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.pie-wrap svg{flex:none}
.lg{list-style:none;margin:0;padding:0;display:grid;gap:10px;flex:1;min-width:190px}
.lg li{display:grid;grid-template-columns:10px minmax(0,1fr) auto 42px;gap:10px;align-items:center}
.sw{width:10px;height:10px;border-radius:3px}
.lg .n{font-weight:600}
.lg .p{text-align:right;color:var(--mu);font-size:12px}
.note{margin-top:12px}
.slice{outline-offset:3px}
.slice:hover,.slice:focus-visible{filter:brightness(1.12)}
#lc svg{display:block;max-width:100%;height:auto;touch-action:pan-y}
#lc svg:focus-visible{outline-offset:0}
.ax{fill:var(--mu);font-size:11px}
#tip{position:fixed;left:0;top:0;z-index:30;pointer-events:none;background:var(--surface);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.6;max-width:260px}
#tip b{font-weight:700}
#tip>b{display:block;color:var(--mu);font-weight:600}
#tip .tr{display:flex;align-items:center;gap:8px}
#tip .tk{display:inline-block;width:12px;flex:none;border-top:3px solid;border-radius:2px}
#tip .tk.e{border-top-color:transparent}

/* 좁은 화면(휴대폰): 한 화면 고정을 풀고 위쪽 메뉴로 바꿈 */
@media(max-width:820px){
 body{overflow:auto}
 #app{display:block;height:auto}
 #side{flex-direction:row;align-items:center;gap:8px;padding:8px;position:sticky;top:0;z-index:5}
 .brand{padding:0 8px;white-space:nowrap}.brand small{display:none}
 #nav{flex-direction:row;flex:1;overflow-x:auto}
 #nav button{width:auto;white-space:nowrap}
 .side-foot{flex-direction:row;margin:0;padding:0;border:0;align-items:center}.side-foot .m{display:none}
 #main{height:auto}
 #v{display:block;padding:0 14px 18px}
 #v>*{margin-bottom:12px}
 .scroll{max-height:70vh}
 .ledger{grid-template-columns:repeat(2,minmax(0,1fr))}
 button.cell{border-bottom:1px solid var(--line)}
 button.cell:last-child{grid-column:1/-1;border-bottom:0}
 .grid2,.cols{display:block}.panel{margin-bottom:12px;max-height:60vh}
 .charts{display:block;overflow:visible}.charts .panel{max-height:none}.pies{display:block}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body>
<div id="login" hidden>
 <form id="lf" class="login-card">
  <h1 class="wordmark"><span>MODORI</span></h1><p class="sub">관리자 콘솔</p>
  <label>이메일<input id="em" type="email" autocomplete="username" required></label>
  <label>비밀번호<input id="pw" type="password" autocomplete="current-password" required></label>
  <button class="primary">로그인</button>
  <p class="m" id="ver" style="margin-top:14px"></p>
 </form>
</div>
<div id="app" hidden>
 <aside id="side">
  <div class="brand">MODORI<small>관리자 콘솔</small></div>
  <nav id="nav"></nav>
  <div class="side-foot"><button data-act="logout">로그아웃</button><span class="m" id="build"></span></div>
 </aside>
 <section id="main">
  <header id="top"><h1 id="title"></h1><span class="m" id="stamp"></span><button class="ghost" data-act="refresh">새로고침</button></header>
  <div id="v"></div>
 </section>
</div>
<div id="tip" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const BUILD='v4'; // 화면에 이 문구가 보이면 새 코드가 배포된 것
$('#ver').textContent='콘솔 '+BUILD;$('#build').textContent='콘솔 '+BUILD;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fdate=v=>v?new Date(v).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'}):'';
const ftime=()=>new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'});
const kday=v=>new Date(v).toLocaleDateString('sv-SE',{timeZone:'Asia/Seoul'});
const ago=v=>{const m=Math.max(0,Math.round((Date.now()-new Date(v))/60000));return m<1?'방금':m<60?m+'분 전':m<1440?Math.floor(m/60)+'시간 전':Math.floor(m/1440)+'일 전'};
const fsec=n=>{n=Number(n)||0;const h=Math.floor(n/3600),m=Math.floor(n%3600/60);return h?`${h}시간 ${m}분`:`${m}분`};
const gender=g=>g==='male'?'남':g==='female'?'여':(g||'');
const CAT={bug:'버그',feature:'기능 제안',account:'계정',room:'방',backup:'백업',etc:'기타'};
const pill=(t,k='')=>({h:`<span class="pill ${['ok','bad','warn'].includes(k)?k:''}">${esc(t)}</span>`});
const cell=v=>v&&typeof v==='object'&&'h' in v?v.h:esc(v);
const tbl=(rows,cols,empty='데이터가 없어요')=>!rows.length?`<div class=empty>${esc(empty)}</div>`:'<table><thead><tr>'+cols.map(c=>`<th>${esc(c[0])}</th>`).join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+cols.map(c=>`<td>${cell(c[1](r))}</td>`).join('')+'</tr>').join('')+'</tbody></table>';
const scroll=(h,cls='')=>`<div class="scroll ${cls}">${h}</div>`;
const seg=(items,cur,act,key)=>`<div class=seg>${items.map(([k,l])=>`<button class="${k==cur?'on':''}" data-act="${act}" data-${key}="${esc(k)}">${esc(l)}</button>`).join('')}</div>`;

// 데이터는 모두 DB 함수(RPC)로 읽음. 각 함수가 관리자 여부를 다시 확인함.
let sb,tok,cur='home',seq=0,period='month',istat='open',isvc='stu',timer=null,tick=0,CH=null,lineTbl=false;
async function rpc(schema,fn,args={}){const{data,error}=await sb.schema(schema).rpc(fn,args);if(error)throw new Error(error.message);return data}
async function api(p,o={}){const r=await fetch(p,{...o,headers:{'content-type':'application/json',Authorization:'Bearer '+tok}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}

// 서비스(스키마)마다 같은 이름의 문의 함수가 있고 응답 모양도 같음. 문의는 서비스별로 따로 저장되므로 서비스별로 호출함.
const SNAME={stu:'STU',gudoks:'Gudoks',book:'BOOK'};
const SVCS=[['stu','STU'],['gudoks','Gudoks']]; // 문의를 받는 서비스. 새 서비스는 여기에 한 줄 추가
const who=q=>q.nickname||(q.userId?'ID '+String(q.userId).slice(0,8):'(알 수 없음)'); // 닉네임이 아직 없는 계정은 ID 앞자리로 표시
const safe=p=>p.then(d=>d,e=>({error:e.message})); // 한 서비스가 실패해도 다른 서비스는 보이도록
// 모든 서비스의 '답변 대기' 문의: 서비스별 결과(res), 합친 최신순 목록(all), 하나라도 성공했는지(ok)
async function openInq(){
 const res=await Promise.all(SVCS.map(([k])=>safe(rpc(k,'admin_list_inquiries',{p_status:'open'}))));
 const all=res.flatMap((d,i)=>d.error?[]:d.inquiries.map(q=>({...q,_svc:SVCS[i][0]}))).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
 return{res,all,ok:res.some(d=>!d.error)}}

const VIEWS={
 home:['개요',vHome],chart:['그래프',vChart,afterChart],users:['이용자',vUsers],rank:['랭크',vRank],rooms:['방',vRooms],inq:['문의',vInq],
 rep:['신고',vRep],ann:['공지',vAnn],mail:['이메일',vMail],srv:['서버 상태',vSrv]};
const setBadge=n=>{const b=$('#b-inq');if(b){b.textContent=n;b.hidden=!n}};

async function init(){
 const c=await(await fetch('/api/config')).json();sb=supabase.createClient(c.url,c.anon);
 sb.auth.onAuthStateChange((_,s)=>{if(s)tok=s.access_token});
 const{data:{session}}=await sb.auth.getSession();session?start(session):$('#login').hidden=false}

// 입장 확인: 토큰 속 값이 아니라 DB(core.admins)에 직접 물어봄
async function start(s){
 let ok=false,why='';
 try{ok=(await rpc('core','am_i_admin'))===true}catch(e){why=e.message}
 if(!ok){await sb.auth.signOut();$('#app').hidden=true;$('#login').hidden=false;
  return alert(why?'관리자 확인 중 오류가 났어요:\n'+why:'관리자 권한이 없어요 (core.admins에 등록되지 않은 계정이에요)')}
 tok=s.access_token;$('#login').hidden=true;$('#app').hidden=false;
 $('#nav').innerHTML=Object.entries(VIEWS).map(([k,v])=>`<button id="n-${k}" data-act="view" data-k="${k}"><span>${v[0]}</span>${k=='inq'?'<span class=badge id=b-inq hidden></span>':''}</button>`).join('');
 if(!timer)timer=setInterval(()=>{if(document.hidden)return;tick++;
  if(cur=='srv')go('srv'); // 서버 상태: 10초마다
  else if((cur=='inq'||cur=='home')&&tick%3==0&&![...document.querySelectorAll('#v textarea')].some(t=>t.value))go(cur); // 30초마다 (답변 작성 중이면 건너뜀)
  else if(tick%6==0)openInq().then(r=>{if(r.ok)setBadge(r.all.length)}).catch(()=>{}); // 문의 배지(모든 서비스 합계): 1분마다
 },10000);
 go('home')}

async function go(k){
 cur=k;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.id=='n-'+k));
 $('#title').textContent=VIEWS[k][0];
 const my=++seq;let h;
 try{h=await VIEWS[k][1]()}catch(e){h='<p class=err>'+esc(e.message)+'</p>'}
 if(my===seq){$('#v').innerHTML=h;$('#stamp').textContent='갱신 '+ftime();if(VIEWS[k][2])VIEWS[k][2]()}} // 세 번째 값은 화면을 붙인 뒤 할 일(그래프 그리기)

async function vHome(){
 const r=await Promise.allSettled([rpc('stu','admin_list_users',{p_max:2000}),openInq(),
  rpc('stu','admin_list_reports',{p_max:200}),rpc('stu','admin_list_rooms',{p_max:2000}),rpc('stu','admin_list_ranking',{p_period:'week',p_max:8}),api('/api/status')]);
 const[u,iq,rp,rm,rk,st]=r.map(x=>x.status==='fulfilled'?x.value:null);
 const dash='-',today=kday(Date.now());
 const users=u?.users,inqs=iq?.ok?iq.all:null,reps=rp?.reports,rooms=rm?.rooms?.filter(x=>!x.deleted);
 if(inqs)setBadge(inqs.length);
 const svcOk=st?st.services.every(s=>s.ok)&&!st.db?.error:null;
 const cellH=(k,lb,nm,sb)=>`<button class=cell data-act=view data-k=${k}><span class=lb>${esc(lb)}</span><span class=nm>${esc(nm)}</span><span class=sb>${esc(sb)}</span></button>`;
 const ledger=`<div class=ledger>`+
  cellH('users','이용자',users?users.length:dash,users?`오늘 가입 ${users.filter(x=>kday(x.createdAt)==today).length}명`:'불러오지 못했어요')+
  cellH('inq','답변 기다리는 문의',inqs?inqs.length:dash,inqs?(inqs.length?`가장 오래된 문의 ${ago(inqs[inqs.length-1].createdAt)}`:'밀린 문의가 없어요'):'불러오지 못했어요')+
  cellH('rep','신고',reps?reps.length:dash,reps?(reps.length?`최근 신고 ${ago(reps[0].createdAt)}`:'접수된 신고가 없어요'):'불러오지 못했어요')+
  cellH('rooms','방',rooms?rooms.length:dash,rooms?`공식 방 ${rooms.filter(x=>x.type==='official').length}개`:'불러오지 못했어요')+
  cellH('srv','서버',svcOk===null?dash:svcOk?'정상':'확인 필요',st&&!st.db?.error?`DB ${st.db.dbSizeMb}MB, 연결 ${st.db.connections}`:'서버 상태 탭에서 확인')+`</div>`;
 const inqPanel=`<section class=panel><header>답변 기다리는 문의<button class=ghost data-act=view data-k=inq>전체 보기</button></header><div class=pb>`+
  (inqs?(inqs.length?inqs.slice(0,12).map(q=>`<button class=row data-act=view data-k=inq data-svc="${esc(q._svc)}"><span class=m>${esc(SNAME[q._svc]||q._svc)}</span><span class=pill>${esc(CAT[q.category]||q.category)}</span><span class=t>${esc(q.title)}</span><span class=m>${esc(who(q))}</span><span class=m>${esc(ago(q.createdAt))}</span></button>`).join(''):'<div class=empty>답변 기다리는 문의가 없어요</div>'):'<div class=empty>불러오지 못했어요</div>')+`</div></section>`;
 const ranked=rk?.rankings?.filter(x=>x.rank!=null).slice(0,8);
 const rkPanel=`<section class=panel><header>이번 주 공부 랭킹<button class=ghost data-act=view data-k=rank>전체 보기</button></header><div class=pb>`+
  (ranked?(ranked.length?ranked.map(x=>`<button class=row data-act=view data-k=rank><span class=rk>${esc(x.rank)}</span><span class=t>${esc(x.nickname)}</span><span class=m>${esc(fsec(x.totalSeconds))}</span></button>`).join(''):'<div class=empty>이번 주 기록이 아직 없어요</div>'):'<div class=empty>불러오지 못했어요</div>')+`</div></section>`;
 const line=st?`<div class=statusline>`+st.services.map(s=>`<span><i class="dot ${s.ok?'ok':'bad'}"></i>${esc(s.service)} ${esc(s.ms)}ms</span>`).join('')+(st.db?.error?`<span class=err>DB: ${esc(st.db.error)}</span>`:`<span>전체 계정 ${esc(st.db.users)}명</span><span>가입자 ${esc(Object.entries(st.db.members||{}).map(([k,v])=>k+' '+v).join(', '))}</span>`)+`</div>`:`<div class=statusline><span class=err>서버 상태를 불러오지 못했어요</span></div>`;
 return ledger+`<div class=grid2>${inqPanel}${rkPanel}</div>`+line}

// ── 그래프 ─────────────────────────────────────────────────────────
// 외부 라이브러리 없이 SVG로 그림. 색은 CSS 변수(--s1~)라서 라이트/다크가 자동으로 바뀜.
// 서비스마다 색을 고정해 둠 (순서나 인원이 바뀌어도 STU는 항상 파랑). 서비스가 4개를 넘으면 색을 추가하고 다시 검증할 것.
const SCOL={stu:'var(--s1)',gudoks:'var(--s2)',book:'var(--s3)'};
const sname=s=>SNAME[s.service]||String(s.service).toUpperCase();
const scol=s=>SCOL[s.service]||'var(--s4)';
const nf=n=>Number(n||0).toLocaleString('ko-KR');
let PIE={}; // 원그래프 조각 정보 (툴팁에서 씀). 이름은 DB에서 온 값일 수 있어서 화면에는 textContent로만 넣음

// 마우스를 올리거나 키보드로 포커스하면 뜨는 설명 상자
function tip(x,y,title,rows){
 const t=$('#tip');t.textContent='';
 const b=document.createElement('b');b.textContent=title;t.appendChild(b);
 for(const r of rows){const d=document.createElement('div');d.className='tr';
  const k=document.createElement('i');k.className='tk'+(r.k?'':' e');if(r.k)k.style.borderTopColor=r.k;d.appendChild(k);
  const s=document.createElement('span');s.textContent=r.t+' ';const v=document.createElement('b');v.textContent=r.v;s.appendChild(v);d.appendChild(s);t.appendChild(d)}
 t.hidden=false;const w=t.offsetWidth,h=t.offsetHeight;
 let L=x+14,T=y+14;if(L+w>innerWidth-8)L=x-w-14;if(T+h>innerHeight-8)T=y-h-14;
 t.style.left=Math.max(8,L)+'px';t.style.top=Math.max(8,T)+'px'}
const untip=()=>{$('#tip').hidden=true};

// 원그래프: parts=[{label,v,col,tip,note}]. 0명인 조각은 그리지 않고(범례에만 표시), 한 조각뿐이면 꽉 찬 원
function pie(id,parts,size=164){
 const tot=parts.reduce((a,p)=>a+p.v,0),c=size/2,r=c-1;
 PIE[id]=parts.map(p=>({...p,pct:tot?Math.round(p.v/tot*100):0}));
 const head=`<svg width=${size} height=${size} viewBox="0 0 ${size} ${size}" role=img aria-label="${esc(parts.map(p=>p.tip+' '+p.v+'명').join(', '))}">`;
 if(!tot)return head+`<circle cx=${c} cy=${c} r=${r} style="fill:var(--sunk)"/></svg>`;
 const live=PIE[id].map((p,i)=>({...p,i})).filter(p=>p.v>0);
 const at=p=>`class=slice tabindex=0 data-pie=${id} data-i=${p.i} aria-label="${esc(p.tip+' '+p.v+'명, '+p.pct+'%')}" style="fill:${p.col};stroke:var(--surface);stroke-width:2"`;
 let body='';
 if(live.length==1)body=`<circle ${at(live[0])} cx=${c} cy=${c} r=${r} />`; // 값에 따옴표가 없으면 '/'가 값에 붙어버리므로 앞에 띄어 씀
 else{let a0=-Math.PI/2;const f=n=>n.toFixed(2);
  for(const p of live){const a1=a0+2*Math.PI*p.v/tot;
   body+=`<path ${at(p)} d="M${c} ${c}L${f(c+r*Math.cos(a0))} ${f(c+r*Math.sin(a0))}A${r} ${r} 0 ${a1-a0>Math.PI?1:0} 1 ${f(c+r*Math.cos(a1))} ${f(c+r*Math.sin(a1))}Z"/>`;a0=a1}}
 return head+body+'</svg>'}

// 범례: 색 · 이름 · 인원 · 비율. 그림을 못 보거나 색을 구분하기 어려워도 숫자는 글자로 읽을 수 있음
const legend=(parts,tot)=>`<ul class=lg>`+parts.map(p=>`<li><i class=sw style="background:${p.col}"></i><span>${esc(p.label)}${p.note?` <span class=m>${esc(p.note)}</span>`:''}</span><span class=n>${nf(p.v)}명</span><span class=p>${tot?Math.round(p.v/tot*100)+'%':'-'}</span></li>`).join('')+`</ul>`;
const piePanel=(id,title,sub,parts,foot)=>{const tot=parts.reduce((a,p)=>a+p.v,0);
 return `<section class=panel><header>${esc(title)}<span class=m>${esc(sub)}</span></header><div class=pb style="padding:16px"><div class=pie-wrap>${pie(id,parts)}${legend(parts,tot)}</div><p class="m note">${esc(foot)}</p></div></section>`};
const linePanel=()=>`<section class=panel><header>모도리 전체 이용자 수 (날짜별 누적)<span><button class=ghost data-act=linetbl>${lineTbl?'그래프로 보기':'표로 보기'}</button></span></header><div class=pb style="padding:8px 12px 0"><div id=lc></div></div><p class="m" style="padding:4px 14px 12px">한국 날짜 기준, 운영자 계정 포함. 지금 남아 있는 계정의 가입일로 센 숫자라서, 탈퇴·삭제된 계정은 과거 숫자에서도 빠져 있어요.</p></section>`;

 try{CH=await rpc('core','admin_charts')}catch(e){CH=null;
  return `<p class=err>${esc(e.message)}</p>`+(/admin_charts/.test(e.message)?`<p class=m style="margin-top:8px">DB에 sql/charts.sql 을 먼저 실행해 주세요.</p>`:'')}
 return chartHTML()}
function chartHTML(){
 const d=CH,stu=d.services.find(s=>s.service=='stu')||{active:0,leaving:0};
 const order=['stu','gudoks','book'],ox=s=>{const i=order.indexOf(s.service);return i<0?99:i}; // 범례·조각 순서는 STU, Gudoks, BOOK 순으로 고정
 const sv=[...d.services].sort((a,b)=>ox(a)-ox(b)).map(s=>({label:sname(s),v:s.active,col:scol(s),tip:'모도리 · '+sname(s),note:s.leaving?`(탈퇴 대기 ${s.leaving})`:''}));
 const st=[{label:'활동 중',v:stu.active,col:'var(--s1)',tip:'STU · 활동 중'},{label:'탈퇴 대기',v:stu.leaving,col:'var(--mu)',tip:'STU · 탈퇴 대기'}];
 return `<div class=charts>${linePanel()}<div class=pies>`+
  piePanel('svc','서비스별 이용자 (모도리 전체)',`전체 계정 ${nf(d.users)}명`,sv,'서비스마다 활동 중인 가입자 수예요. 한 사람이 여러 서비스에 가입할 수 있어서 합계가 전체 계정 수와 다를 수 있어요.')+
  piePanel('stu','STU 가입 상태',`가입자 ${nf(stu.active+stu.leaving)}명`,st,'탈퇴 대기는 STU 또는 모도리 계정 탈퇴를 요청해 유예 중인 사람이에요.')+`</div></div>`}

function afterChart(){
 if(!CH||!$('#lc'))return;
 if(lineTbl){$('#lc').innerHTML=`<div class=scroll style="max-height:300px;border:0;border-radius:0">`+tbl([...CH.series].reverse(),[['날짜',r=>r.d],['그날 가입',r=>r.new?'+'+r.new:'0'],['누적 이용자',r=>nf(r.total)+'명']])+`</div>`;return}
 drawLine()}

// 날짜별 누적 이용자 선 그래프. 가로 길이를 재서 그 크기로 그림(글자가 작아지지 않도록)
function drawLine(){
 const el=$('#lc');if(!el||!CH)return;
 const S=CH.series,n=S.length;if(!n){el.innerHTML='<div class=empty>아직 데이터가 없어요</div>';return}
 const w=Math.max(280,el.clientWidth||600),h=w<480?220:260,m={l:36,r:16,t:22,b:26},pw=w-m.l-m.r,ph=h-m.t-m.b;
 const mx=Math.max(1,...S.map(d=>d.total));
 const step=[1,2,5,10,20,50,100,200,500,1000,2000,5000,10000,20000,50000].find(s=>mx/s<=5)||100000;
 const top=Math.ceil((mx+.0001)/step)*step; // 최댓값 위에 한 칸 여유를 둠 (끝 글자가 잘리지 않게)
 const X=i=>+(m.l+(n>1?pw*i/(n-1):pw/2)).toFixed(1),Y=v=>+(m.t+ph*(1-v/top)).toFixed(1);
 const md=d=>{const[,mo,da]=d.split('-');return (+mo)+'/'+(+da)};
 let g='';for(let v=0;v<=top;v+=step)g+=`<line x1=${m.l} x2=${w-m.r} y1=${Y(v)} y2=${Y(v)} style="stroke:var(--line)"/><text class=ax x=${m.l-8} y=${Y(v)+4} text-anchor=end>${nf(v)}</text>`;
 const sd=n>1?Math.max(1,Math.ceil(72/(pw/(n-1)))):1; // 날짜 글자가 겹치지 않게 며칠마다 표시할지. 끝 날짜부터 같은 간격으로 찍음
 const idx=[];for(let i=n-1;i>=0;i-=sd)idx.unshift(i);
 let xl='';for(const i of idx)xl+=`<text class=ax x=${X(i)} y=${h-6} text-anchor=middle>${md(S[i].d)}</text>`;
 const pts=S.map((d,i)=>X(i)+' '+Y(d.total)),line='M'+pts.join('L'),area=`M${X(0)} ${Y(0)}L`+pts.join('L')+`L${X(n-1)} ${Y(0)}Z`;
 const last=S[n-1],lx=X(n-1),ly=Y(last.total),ring='fill:var(--tx);stroke:var(--surface);stroke-width:2';
 el.innerHTML=`<svg width=${w} height=${h} viewBox="0 0 ${w} ${h}" role=img tabindex=0 aria-label="${esc(`모도리 이용자 수, ${md(S[0].d)}부터 ${md(last.d)}까지, 현재 ${last.total}명. 좌우 방향키로 날짜별 값을 볼 수 있어요`)}">`+
  g+`<line x1=${m.l} x2=${w-m.r} y1=${Y(0)} y2=${Y(0)} style="stroke:var(--mu);opacity:.45"/>`+
  `<path d="${area}" style="fill:var(--tx);opacity:.08"/>`+
  `<path d="${line}" style="fill:none;stroke:var(--tx);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`+xl+
  `<g id=hv style="display:none"><line id=hl y1=${m.t} y2=${m.t+ph} style="stroke:var(--mu);opacity:.6"/><circle id=hd r=4.5 style="${ring}"/></g>`+
  `<circle cx=${lx} cy=${ly} r=4.5 style="${ring}"/>`+
  `<text class=ax x=${lx} y=${ly-10} text-anchor=end style="fill:var(--tx);font-weight:600;font-size:12px">현재 ${nf(last.total)}명</text>`+
  `<rect id=hr x=${m.l} y=${m.t-6} width=${pw} height=${ph+6} style="fill:transparent"/></svg>`;
 const svg=el.firstElementChild,hv=svg.querySelector('#hv'),hl=svg.querySelector('#hl'),hd=svg.querySelector('#hd'),hr=svg.querySelector('#hr');
 let k=-1;
 const at=(i,cx,cy)=>{k=Math.max(0,Math.min(n-1,i));const d=S[k],x=X(k),y=Y(d.total);
  hl.setAttribute('x1',x);hl.setAttribute('x2',x);hd.setAttribute('cx',x);hd.setAttribute('cy',y);hv.style.display='';
  tip(cx,cy,d.d,[{k:'var(--tx)',t:'누적 이용자',v:nf(d.total)+'명'},{t:'그날 가입',v:(d.new?'+':'')+nf(d.new)+'명'}])};
 const off=()=>{hv.style.display='none';untip()};
 hr.addEventListener('pointermove',e=>{const r=svg.getBoundingClientRect();at(n>1?Math.round(((e.clientX-r.left)*(w/r.width)-m.l)/pw*(n-1)):0,e.clientX,e.clientY)});
 hr.addEventListener('pointerleave',off);
 svg.addEventListener('keydown',e=>{if(e.key=='Escape')return off();if(e.key!='ArrowLeft'&&e.key!='ArrowRight')return;e.preventDefault();
  const j=Math.max(0,Math.min(n-1,(k<0?n-1:k)+(e.key=='ArrowLeft'?-1:1))),r=svg.getBoundingClientRect();
  at(j,r.left+X(j)*r.width/w,r.top+Y(S[j].total)*r.height/h)});
 svg.addEventListener('blur',off)}

// 원그래프 조각 위에서도 같은 설명 상자 (마우스 올림 / 키보드 포커스)
const sliceInfo=e=>{const s=e.target.closest&&e.target.closest('.slice');return s?{s,p:(PIE[s.dataset.pie]||[])[+s.dataset.i]}:{}};
document.addEventListener('pointermove',e=>{const{p}=sliceInfo(e);if(p)tip(e.clientX,e.clientY,p.tip,[{k:p.col,t:'인원',v:`${nf(p.v)}명 (${p.pct}%)`}])});
document.addEventListener('pointerout',e=>{if(sliceInfo(e).s)untip()});
document.addEventListener('focusin',e=>{const{s,p}=sliceInfo(e);if(p){const r=s.getBoundingClientRect();tip(r.left+r.width/2,r.top+r.height/2,p.tip,[{k:p.col,t:'인원',v:`${nf(p.v)}명 (${p.pct}%)`}])}});
document.addEventListener('focusout',e=>{if(sliceInfo(e).s)untip()});
let rz;addEventListener('resize',()=>{if(cur=='chart'&&CH&&!lineTbl){cancelAnimationFrame(rz);rz=requestAnimationFrame(drawLine)}});

// 버튼 처리 (data-act 방식: 사용자 데이터를 코드에 끼워 넣지 않음)
document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
 b.disabled=true;
 try{
  if(a=='view'){if(SVCS.some(s=>s[0]==b.dataset.svc))isvc=b.dataset.svc;await go(b.dataset.k)} // data-svc가 있으면 그 서비스의 문의로 바로 이동
  else if(a=='logout'){await sb.auth.signOut();location.reload();return}
  else if(a=='refresh')await go(cur);
  else if(a=='period'){period=b.dataset.p;await go('rank')}
  else if(a=='inqstat'){istat=b.dataset.s;await go('inq')}
  else if(a=='inqsvc'){if(SVCS.some(s=>s[0]==b.dataset.s)){isvc=b.dataset.s;await go('inq')}}
  else if(a=='linetbl'){lineTbl=!lineTbl;$('#v').innerHTML=chartHTML();afterChart()}
  else if(a=='reply'){const t=b.closest('.item').querySelector('textarea').value.trim();
   const sv=(SVCS.find(s=>s[0]==b.dataset.v)||[])[0]; // 답변은 그 문의가 속한 서비스의 함수로 보냄
   if(!sv){alert('서비스를 확인할 수 없어요. 새로고침 해주세요');}
   else if(!t){alert('답변을 입력하세요');}
   else{await rpc(sv,'admin_reply_inquiry',{p_body:{userId:b.dataset.u,inquiryId:b.dataset.i,reply:t}});await go('inq')}}
  else if(a=='addnotice'){await rpc('stu','post_notice',{p_title:$('#at').value,p_body:$('#ab').value,p_pinned:$('#ap').checked});await go('ann')}
  else if(a=='delnotice'){if(confirm('삭제할까요?')){await rpc('stu','delete_notice',{p_id:b.dataset.id});await go('ann')}}
  else if(a=='send'){await api('/api/send-email',{method:'POST',body:JSON.stringify({to:$('#mt').value,subject:$('#ms').value,body:$('#mb').value})});await go('mail')}
 }catch(err){alert(err.message)}
 finally{b.disabled=false}});
$('#lf').addEventListener('submit',async e=>{e.preventDefault();
 const{data,error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
 error?alert(error.message):start(data.session)});
init().catch(e=>{$('#login').hidden=false;alert('초기화 실패: '+e.message)});
</script></body></html>
